<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeSprint</title>
<meta name="description" content="Plan goals and projects with epics, sprints, releases and a dashboard. Works offline; your plan stays in your browser.">
<meta name="theme-color" content="#0c66e4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root{--bg:#fff;--sunken:#f7f8f9;--card:#fff;--hover:#f1f2f4;--press:#e9ebee;--sel:#e9f2ff;--ink:#172b4d;--sub:#44546f;--mute:#626f86;--line:#dcdfe4;--brand:#0c66e4;--brand-h:#0055cc;--red:#c9372c;
  --l-todo:#dcdfe4;--t-todo:#44546f;--l-inprogress:#cce0ff;--t-inprogress:#0055cc;--l-review:#dfd8fd;--t-review:#5e4db2;--l-done:#baf3db;--t-done:#216e4e;
  --shadow:0 1px 1px #091e4240,0 0 1px #091e424f;--shadow-lg:0 8px 12px #091e4226,0 0 1px #091e424f;--overlay:#091e427a;--c-blue:#2a78d6;--c-aqua:#1baf7a;--c-violet:#6250d6;--c-neutral:#8590a2;--crit:#c9372c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2125;--sunken:#161a1d;--card:#22272b;--hover:#2c333a;--press:#38414a;--sel:#1c2b41;--ink:#b6c2cf;--sub:#9fadbc;--mute:#8c9bab;--line:#38414a;--brand:#579dff;--brand-h:#85b8ff;--red:#f87168;
  --l-todo:#454f59;--t-todo:#b6c2cf;--l-inprogress:#09326c;--t-inprogress:#85b8ff;--l-review:#352c63;--t-review:#b8acf6;--l-done:#164b35;--t-done:#7ee2b8;
  --shadow:0 0 0 1px #bcd6f00a,0 1px 1px #03040480;--shadow-lg:0 8px 12px #0304045c,0 0 1px #03040480;--overlay:#10121499;--c-blue:#3987e5;--c-aqua:#199e70;--c-violet:#9085e9;--c-neutral:#738496;--crit:#f87168;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d2125;--sunken:#161a1d;--card:#22272b;--hover:#2c333a;--press:#38414a;--sel:#1c2b41;--ink:#b6c2cf;--sub:#9fadbc;--mute:#8c9bab;--line:#38414a;--brand:#579dff;--brand-h:#85b8ff;--red:#f87168;
  --l-todo:#454f59;--t-todo:#b6c2cf;--l-inprogress:#09326c;--t-inprogress:#85b8ff;--l-review:#352c63;--t-review:#b8acf6;--l-done:#164b35;--t-done:#7ee2b8;
  --shadow:0 0 0 1px #bcd6f00a,0 1px 1px #03040480;--shadow-lg:0 8px 12px #0304045c,0 0 1px #03040480;--overlay:#10121499;--c-blue:#3987e5;--c-aqua:#199e70;--c-violet:#9085e9;--c-neutral:#738496;--crit:#f87168;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;font:14px/20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
::selection{background:var(--sel)}
.flex{flex:1}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--sunken);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .2s ease}
.proj{display:flex;align-items:center;gap:10px;padding:16px 14px 12px;white-space:nowrap;overflow:hidden}
.pav{width:32px;height:32px;flex:none;border-radius:6px;background:linear-gradient(135deg,#0c66e4,#6e5dc6);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.pn b{display:block;font-size:14px}.pn span{font-size:12px;color:var(--mute)}
.side nav{display:flex;flex-direction:column;gap:2px;padding:8px}
.side nav a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:4px;color:var(--sub);text-decoration:none;font-weight:500;white-space:nowrap;overflow:hidden;position:relative;transition:background .12s}
.side nav a:hover{background:var(--hover)}
.side nav a.on{background:var(--sel);color:var(--brand)}
.side nav a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--brand)}
.side nav svg{flex:none}
.sfoot{margin-top:auto;padding:8px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
.sfoot button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:8px 10px;border-radius:4px;cursor:pointer;color:var(--sub);white-space:nowrap;overflow:hidden;text-align:left}
.sfoot button:hover{background:var(--hover)}
.shell.min .side{width:56px}.shell.min .lbl,.shell.min .pn{display:none}
.shell.min #collapse svg{transform:rotate(180deg)}
#collapse svg{transition:transform .2s}

.mainw{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.crumb{color:var(--mute)}.crumb b{color:var(--ink);font-weight:500}
#saved{font-size:12px;color:var(--mute);transition:opacity .3s}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:0 8px;height:32px;width:240px;color:var(--mute);background:var(--bg);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
main{padding:20px 32px 40px;max-width:1440px;width:100%}
h1{font-size:24px;line-height:28px;font-weight:600;margin:0}
h3{margin:0;font-size:14px;font-weight:600}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:4px;background:var(--hover);color:var(--sub);font-weight:500;cursor:pointer;transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--press)}
.btn.p{background:var(--brand);color:#fff}.btn.p:hover{background:var(--brand-h)}
:root[data-theme="dark"] .btn.p{color:#1d2125}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#1d2125}}
.btn.g{background:none}.btn.g:hover{background:var(--hover)}
.btn.s{height:28px;padding:0 8px;font-size:13px}
.btn.d{color:var(--red)}
.fsel{height:32px;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:0 8px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;margin:4px 0 20px;flex-wrap:wrap}

/* icons */
.ti{flex:none;border-radius:3px}
.pri{display:inline-flex;flex:none}
.chev{width:24px;height:24px;flex:none;display:grid;place-items:center;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--sub);padding:0}
.chev:hover{background:var(--press)}
.chev svg{transition:transform .15s ease}.chev.open svg{transform:rotate(90deg)}

/* lozenges */
.lozw{position:relative;display:inline-flex;flex:none}
.loz{appearance:none;-webkit-appearance:none;border:0;border-radius:3px;font-size:11px;font-weight:700;line-height:16px;text-transform:uppercase;padding:2px 20px 2px 6px;cursor:pointer;transition:filter .12s}
.loz:hover{filter:brightness(.95)}
.lozw::after{content:"";position:absolute;right:7px;top:50%;width:5px;height:5px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none;color:var(--sub)}
.loz option{background:var(--card);color:var(--ink);text-transform:none;font-weight:400}
.s-todo{background:var(--l-todo);color:var(--t-todo)}.s-inprogress{background:var(--l-inprogress);color:var(--t-inprogress)}
.s-review{background:var(--l-review);color:var(--t-review)}.s-done{background:var(--l-done);color:var(--t-done)}
.loz.big{font-size:13px;padding:6px 28px 6px 10px}
.elz{font-size:11px;font-weight:700;line-height:16px;text-transform:uppercase;padding:2px 6px;border-radius:3px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;
  background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.pts{min-width:24px;height:20px;line-height:20px;border-radius:10px;background:var(--press);text-align:center;font-size:12px;font-weight:600;padding:0 7px;color:var(--sub);flex:none}
.ptl{min-width:24px;height:20px;line-height:20px;border-radius:10px;text-align:center;font-size:12px;font-weight:600;padding:0 7px}

/* backlog */
.sec{background:var(--sunken);border-radius:6px;margin-bottom:16px;padding:4px 8px 8px;transition:box-shadow .15s}
.sec.over{box-shadow:inset 0 0 0 2px var(--brand)}
.sh{display:flex;align-items:center;gap:8px;padding:6px 0 6px;min-height:44px}
.sh b{font-size:14px}.sh .mute{font-size:13px}
.goal{font-size:13px;color:var(--mute);margin:-4px 0 8px 32px}
.sec.closed .list,.sec.closed .add,.sec.closed .goal{display:none}
.list{background:var(--card);border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s;background:var(--card)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.sub{padding-left:32px;background:var(--sunken)}.row.sub:hover{background:var(--hover)}
.row .tg{width:24px;flex:none}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .t{text-decoration:line-through;color:var(--mute)}
.row.dragging,.card.dragging{opacity:.4}
.key{color:var(--mute);font-size:12px;font-weight:500;flex:none;min-width:44px}
.kc{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 4px;flex:none}
.add input{width:100%;margin-top:4px;height:36px;border:1px solid transparent;border-radius:4px;background:none;padding:0 10px;color:var(--sub);outline:0;transition:background .12s,border-color .12s}
.add input::placeholder{color:var(--sub);font-weight:500}
.add input:hover{background:var(--hover)}
.add input:focus{background:var(--card);border-color:var(--brand)}
.add input:focus::placeholder{color:var(--mute);font-weight:400}
.empty{color:var(--mute);padding:14px;text-align:center;font-size:13px}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:8px;align-items:start;overflow-x:auto}
.col{background:var(--sunken);border-radius:6px;padding:8px;min-height:calc(100vh - 210px);transition:box-shadow .15s}
.col.over{box-shadow:inset 0 0 0 2px var(--brand)}
.col h3{padding:6px 6px 10px;color:var(--sub);text-transform:uppercase;font-size:12px;font-weight:600;display:flex;gap:6px}
.card{background:var(--card);border-radius:4px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);cursor:grab;transition:background .1s,box-shadow .15s}
.card:hover{background:var(--hover)}
.card .ct{margin-bottom:8px}.card .par{font-size:12px;color:var(--mute);margin:-4px 0 8px}
.card .m{display:flex;align-items:center;gap:6px;margin-top:8px}

/* epics */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ec{background:var(--card);border-radius:6px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s,transform .15s;position:relative;overflow:hidden}
.ec::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.ec:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.ec .eh{display:flex;align-items:center;gap:8px}
.prog{height:6px;background:var(--press);border-radius:3px;overflow:hidden;margin:14px 0 6px}.prog i{display:block;height:100%;background:#22a06b;border-radius:3px;transition:width .3s}
.mute{color:var(--mute);font-size:12px}

/* modal */
.modal{position:fixed;inset:0;background:var(--overlay);display:flex;justify-content:center;align-items:flex-start;padding:60px 20px;z-index:20;overflow:auto;animation:fade .15s ease-out}
.mb{background:var(--card);border-radius:8px;width:620px;max-width:100%;padding:24px;box-shadow:var(--shadow-lg);position:relative;animation:pop .18s cubic-bezier(.2,.8,.3,1)}
.mb.wide{width:1000px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.mb .x{position:absolute;right:14px;top:14px}
.mb label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin:14px 0 4px}
.mb input,.mb select:not(.loz),.mb textarea{width:100%;padding:6px 8px;border:2px solid var(--line);border-radius:4px;background:var(--bg);outline:0;transition:border-color .12s,background .12s}
.mb input:hover,.mb select:not(.loz):hover,.mb textarea:hover{background:var(--hover)}
.mb input:focus,.mb select:not(.loz):focus,.mb textarea:focus{border-color:var(--brand);background:var(--bg)}
.mb textarea{resize:vertical}
.mb .two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.foot{display:flex;gap:8px;margin-top:22px}
.mh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:-4px 40px 14px 0}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px}
.mb textarea.ttl{font-size:22px;line-height:28px;font-weight:600;border-color:transparent;background:none;resize:none;padding:4px 6px;margin-left:-8px;width:calc(100% + 8px)}
.mb textarea.ttl:hover{background:var(--hover)}
.mb .ttl:focus{border-color:var(--brand)}
.details{border:1px solid var(--line);border-radius:6px;margin-top:16px}
.details .dh{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.dr{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;padding:5px 14px}
.dr:first-of-type{padding-top:10px}.dr:last-child{padding-bottom:12px}
.dr span{font-size:13px;color:var(--sub);font-weight:600}
.mb .dr input,.mb .dr select{border-color:transparent;background:none;padding:4px 6px}
.mb .dr input:hover,.mb .dr select:hover{background:var(--hover)}
.mb .dr input:focus,.mb .dr select:focus{border-color:var(--brand)}
.subhead{display:flex;align-items:center;gap:10px;margin:22px 0 6px}
.subhead .prog{flex:1;margin:0}

/* reports & roadmap */
.card-box{background:var(--card);border-radius:6px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.rm{position:relative;overflow-x:auto;background:var(--card);border-radius:6px;padding:10px 0;box-shadow:var(--shadow)}
.rm .r{position:relative;height:36px;border-bottom:1px solid var(--line)}
.rm .b{position:absolute;top:7px;height:22px;border-radius:4px;color:#fff;font-size:12px;font-weight:500;padding:2px 8px;overflow:hidden;white-space:nowrap;cursor:pointer;transition:filter .12s}
.rm .b:hover{filter:brightness(1.1)}
.rm .tl{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2}
.rm .mo{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--mute);padding:2px 4px}
svg .ax{stroke:var(--line)}svg text{fill:var(--mute)}svg .ideal{stroke:var(--mute)}
.vc{background:var(--press)}
.mini{width:110px;height:6px;background:var(--press);border-radius:3px;overflow:hidden;flex:none}.mini i{display:block;height:100%;background:#22a06b;border-radius:3px}
.erow{font-weight:500}.erow .ptl{text-align:center}
.nest .row{padding-left:32px}.nest .row.sub{padding-left:60px}.nest .empty{padding:8px}
.s-overdue{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red)}
.rv{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 5px;flex:none;white-space:nowrap}
.pill{background:var(--press);border-radius:3px;padding:2px 6px;font-size:12px;font-weight:600;color:var(--sub)}

/* data, toasts */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.dgrid .btn{justify-content:center;height:38px}
.warn{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--ink);border-radius:4px;padding:8px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;z-index:50;box-shadow:var(--shadow-lg);animation:pop .2s}
#backup{background:color-mix(in srgb,#e2b203 25%,transparent);color:var(--ink)}
[hidden]{display:none!important}

/* dashboard */
.seg{display:inline-flex;background:var(--hover);border-radius:4px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:3px;cursor:pointer;color:var(--sub);font-weight:500;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:6px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .kl{font-size:12px;font-weight:600;color:var(--sub)}
.kpi .kv{font-size:28px;line-height:36px;font-weight:600;margin:4px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .ks{font-size:12px;color:var(--mute)}
.crit{color:var(--crit);font-weight:600}
.dgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.dgrid2 .card-box{margin:0}.dgrid2 .wide{grid-column:1/-1}
@media (max-width:1000px){.dgrid2{grid-template-columns:minmax(0,1fr)}}
.ch{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-dasharray:2 3}.chart .base{stroke:var(--line)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .endl{fill:var(--sub);font-size:12px;font-weight:500}.chart .endv{fill:var(--ink);font-weight:700}
.chart .xh line{stroke:var(--mute);stroke-width:1}.chart .xh circle{stroke:var(--card);stroke-width:2}
.chart .hit,.chart .hitb{fill:transparent}.chart .mark{outline:none}.chart .mark:hover .bar,.chart .mark:focus .bar{filter:brightness(1.15)}
.chart .mark:focus .hitb{fill:var(--hover)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--sub);margin-bottom:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}.legend i.ln{width:14px;height:3px;border-radius:2px}
.tv{margin-top:6px;font-size:12px;overflow-x:auto}.tv summary{cursor:pointer;color:var(--sub)}
.tv table{border-collapse:collapse;margin-top:6px;width:100%}.tv th,.tv td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stack{display:flex;gap:2px;height:14px;margin:8px 0 12px}.stack i{border-radius:3px;min-width:4px;outline:none}.stack i:hover,.stack i:focus{filter:brightness(1.15)}
.slist div{display:grid;grid-template-columns:12px 1fr 40px 130px;gap:8px;align-items:center;font-size:13px;padding:3px 0}.slist i{width:10px;height:10px;border-radius:2px}.slist b{text-align:right;font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-template-columns:16px 64px 1fr 32px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.htrack{height:10px;background:var(--hover);border-radius:3px;overflow:hidden}.htrack i{display:block;height:100%;background:var(--c-blue);border-radius:0 3px 3px 0;outline:none}
.hrow b{text-align:right;font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 120px;gap:12px;align-items:center;padding:7px 4px;border-radius:4px;cursor:pointer;font-size:13px}
.prow:hover{background:var(--hover)}
.pname{display:flex;align-items:center;gap:8px;min-width:0}.pname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.track{display:flex;gap:2px;height:10px;background:var(--press);border-radius:3px;overflow:hidden}.track i{height:100%;outline:none}.track i:first-child{border-radius:3px 0 0 3px}
.pval{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}.pval b{color:var(--ink)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--card);color:var(--ink);border-radius:6px;box-shadow:var(--shadow-lg);padding:8px 10px;font-size:12px;min-width:120px;border:1px solid var(--line)}
.tip .tt{color:var(--sub);margin-bottom:4px;font-weight:500}
.tip .tr{display:flex;align-items:center;gap:8px;padding:1px 0}.tip .tr i{width:12px;height:3px;border-radius:2px}.tip .tr b{font-size:13px;font-variant-numeric:tabular-nums}.tip .tr span{color:var(--sub)}

/* assignee, ranking, activity */
.av{width:22px;height:22px;border-radius:50%;background:#6e5dc6;color:#fff;font-size:10px;font-weight:700;display:inline-grid;place-items:center;flex:none;letter-spacing:.3px}
.row.dropbefore{box-shadow:inset 0 2px 0 var(--brand)}
.mh .btn{margin-left:auto}
#tab-c,#tab-h{margin-top:10px}
.cadd{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}.cadd textarea{flex:1}.cadd .btn{height:34px}
.cm{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.cmh{display:flex;align-items:center;gap:8px;font-size:12px}.cmh .btn{height:22px;font-size:12px}
.cmt{white-space:pre-wrap;word-break:break-word;margin-top:4px;font-size:14px}
.hi{display:grid;grid-template-columns:150px 1fr;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.hi:last-child{border-bottom:0}

/* phones & small windows */
@media (max-width:760px){
  .side{width:56px}.lbl,.pn{display:none}
  .top{padding:0 10px;gap:8px}.crumb,#saved{display:none}.search{width:auto;flex:1;min-width:0}
  main{padding:16px 12px 32px}
  .sh{flex-wrap:wrap}.bar{gap:6px}.fsel{max-width:100%}
  .row .elz,.row .rv,.row .kc,.row .key,.row .av{display:none}.hi{grid-template-columns:1fr}
  .mgrid,.mb .two,.dgrid{grid-template-columns:1fr}.mb{padding:18px}.modal{padding:16px 8px}
  .prow{grid-template-columns:minmax(0,1fr) auto}.prow .track{grid-column:1/-1;grid-row:2}
  .kpis{grid-template-columns:1fr 1fr}.kpi .kv{font-size:22px;line-height:28px}
  .slist div{grid-template-columns:12px 1fr 32px}.slist .mute{display:none}
}
</style></head><body>

      <button id="data" title="Data &amp; backup"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></svg><span class="lbl">Data &amp; backup</span></button>

      <button id="collapse" title="Collapse sidebar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg><span class="lbl">Collapse</span></button>
    </div>
  </aside>
  <div class="mainw">
    <header class="top">
      <div class="crumb">Projects / <b>My Plan</b></div><span class="flex"></span><span id="saved"></span><button class="btn s" id="backup" hidden title="Download a backup of your plan">Back up now</button>

      <button class="btn p" id="create">Create</button>
    </header>
    <main id="app"></main>
  </div>
</div>
<div id="tip" class="tip" hidden></div>
